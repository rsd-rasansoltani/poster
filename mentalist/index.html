
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Video Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="https://cdn.plyr.io/static/icons/favicon.ico" />

  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.4/demo.css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000 !important;
      color: #fff;
    }

    body {
      overflow-x: hidden;
    }

    .grid {
      background: #000 !important;
      max-width: 100%;
    }

    header {
      background: #000 !important;
      text-align: center;
      padding: 20px 15px 10px;
    }

    header > img {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }

    #container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    #container video {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    @media (max-width: 768px) {
      header {
        padding: 10px 10px 5px;
      }

      header > img {
        width: 100%;
        border-radius: 5px;
      }

      #container {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="grid">

    <header>
      <img
        src="https://cdn.imgurl.ir/uploads/q599881_Polish_20260924_152050481.png"
        alt="Poster"
      />
    </header>

    <main>
      <div id="container">

        <video
          src="https://cdn.imgurl.ir/uploads/r722578_YouCut_20260924_151812107.mp4"
          controls
          playsinline
        ></video>

      </div>

      <ul>
        <li class="plyr__cite plyr__cite--video" hidden>
          <small>
            <a href="https://RasanDesign.ir" target="_blank">
              View From A RasanDesign.ir
            </a>

            &copy; Badalijat Nima
          </small>
        </li>
      </ul>

    </main>

  </div>

  <script
    src="https://cdn.plyr.io/3.6.4/demo.js"
    crossorigin="anonymous">
  </script>

</body>
</html>
